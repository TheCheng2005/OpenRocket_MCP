name: RocketMaxxing installers

# Installers with Java included, one per platform (jpackage builds only for the machine it runs on). Each packaged
# app is started and used before its installer is built; the installers are kept as the run's artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    tags: ['rocketmaxxing-v*']
    paths:
      - app/**
      - src/main/**
      - build.gradle
      - scripts/test_rocketmaxxing.py
      - .github/workflows/installers.yml
  pull_request:
    paths:
      - build.gradle
      - app/packaging/**
      - .github/workflows/installers.yml

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
            name: linux-x64-deb
            launcher: build/installers/RocketMaxxing/bin/RocketMaxxing
          - os: windows-latest
            type: msi
            name: windows-x64-msi
            # The Windows launcher is a windowed program (no console to print the address to): run its Java directly.
            launcher: build/installers/RocketMaxxing/runtime/bin/java.exe -Xss4m -cp 'build/installers/RocketMaxxing/app/*' io.github.openrocketmcp.app.App
          - os: macos-latest
            type: dmg
            name: macos-apple-silicon-dmg
            launcher: build/installers/RocketMaxxing.app/Contents/MacOS/RocketMaxxing
          - os: macos-15-intel
            type: dmg
            name: macos-intel-dmg
            launcher: build/installers/RocketMaxxing.app/Contents/MacOS/RocketMaxxing
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Packaging tools (fakeroot for .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Packaging tools (WiX 3 for .msi)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.14.1 -y --no-progress
      - name: Build the packaged app
        run: ./gradlew rocketmaxxingInstaller -PinstallerType=app-image
      - name: Start the packaged app and use it
        shell: bash
        run: python scripts/test_rocketmaxxing.py ${{ matrix.launcher }}
      - name: Build the installer
        run: ./gradlew rocketmaxxingInstaller -PinstallerType=${{ matrix.type }}
      - uses: actions/upload-artifact@v4
        with:
          name: rocketmaxxing-${{ matrix.name }}
          path: build/installers/*.${{ matrix.type }}
          if-no-files-found: error
