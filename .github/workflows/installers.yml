name: RocketMaxxing installers

# Installers with Java included, one per platform (jpackage builds only for the machine it runs on).
on:
  workflow_dispatch:
  push:
    tags: ['rocketmaxxing-v*']
  pull_request:
    paths:
      - build.gradle
      - app/packaging/**
      - .github/workflows/installers.yml

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: windows-latest
            type: msi
          - os: macos-latest
            type: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Packaging tools (fakeroot for .deb)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Packaging tools (WiX 3 for .msi)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.14.1 -y --no-progress
      - name: Build the installer
        run: ./gradlew rocketmaxxingInstaller -PinstallerType=${{ matrix.type }}
      - uses: actions/upload-artifact@v4
        with:
          name: rocketmaxxing-${{ matrix.type }}
          path: build/installers/*.${{ matrix.type }}
          if-no-files-found: error
