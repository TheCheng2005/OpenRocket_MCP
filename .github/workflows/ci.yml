name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew test installDist
      - name: Stdio smoke test
        shell: bash
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ./scripts/openrocket-mcp 2>/dev/null)
          echo "$out" | grep -q '"name":"check_requirements"'
      - name: Scenario benchmark
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark.py

  extension:
    # One-click Claude Desktop extension per platform, with a bundled Java runtime.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build extension
        run: ./gradlew mcpb
      - name: Start it like Claude Desktop does
        run: python scripts/test_mcpb.py "build/distributions/*.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: build/distributions/*.mcpb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.mcpb
