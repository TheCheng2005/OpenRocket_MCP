name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew test installDist
      - name: Stdio smoke test
        shell: bash
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ./scripts/openrocket-mcp 2>/dev/null)
          echo "$out" | grep -q '"name":"check_requirements"'
      - name: Scenario benchmark
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark.py
