<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRocket design view</title>
<style>
:root {
  color-scheme: light;
  --surface: var(--color-background-primary, #fcfcfb);
  --raised: var(--color-background-secondary, #f3f2ee);
  --ink: var(--color-text-primary, #0b0b0b);
  --ink2: var(--color-text-secondary, #52514e);
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: var(--color-border-primary, rgba(11, 11, 11, 0.12));
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --info: #898781;
  --accent: #2a78d6;
  --view-a: #e9eef5; --view-b: #fafaf9;
  --sky-a: #c9dcf0; --sky-b: #f3f6f9;
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  --radius: var(--border-radius-md, 8px);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--color-background-primary, #1a1a19);
  --raised: var(--color-background-secondary, #262624);
  --ink: var(--color-text-primary, #f0efec);
  --ink2: var(--color-text-secondary, #c3c2b7);
  --grid: #2c2c2a; --axis: #45453f;
  --ring: var(--color-border-primary, rgba(255, 255, 255, 0.12));
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --accent: #3987e5;
  --view-a: #232830; --view-b: #171716;
  --sky-a: #172231; --sky-b: #1b1b1a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 var(--font); }
body { -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; }
body.fill .app { height: 100vh; min-height: 900px; } /* a short window scrolls rather than squeezing the model */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; line-height: 1.3; }
.sub { color: var(--ink2); font-size: 13px; }
.actions { display: flex; gap: 6px; flex: none; }
.btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 7px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--ring); border-radius: var(--radius); padding: 8px 12px 9px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tile .l { color: var(--ink2); font-size: 12.5px; line-height: 1.3; }
.tile .v { font-size: 22px; font-weight: 600; line-height: 1.2; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tile .u { font-size: 13px; color: var(--ink2); font-weight: 400; margin-left: -2px; }
.tile .s { font-size: 12px; color: var(--muted); line-height: 1.3; }
button.tile { text-align: left; background: none; cursor: pointer; }
button.tile:hover { background: var(--raised); }
.banner { border: 1px solid var(--ring); border-left: 3px solid var(--crit); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--ring); }
.tabs button { border: 0; background: none; padding: 8px 14px; font-size: 14.5px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.pill { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; font-size: 12px; font-weight: 600; background: var(--raised); color: var(--ink2); }
.panel { height: 600px; overflow: auto; }
body.fill .panel { height: auto; flex: 1 1 0; min-height: 340px; }
#tab-model { overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.vbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vbar .grow { flex: 1; }
.model { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; flex: 1 1 auto; min-height: 0; }
.viewport { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--ring); touch-action: none; min-height: 0; background: linear-gradient(var(--view-a), var(--view-b)); }
.viewport.fly { background: linear-gradient(var(--sky-a), var(--sky-b)); }
#gl { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
#gl.dragging { cursor: grabbing; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.overlay text { font: 12px var(--font); paint-order: stroke; stroke: var(--view-b); stroke-width: 3px; stroke-linejoin: round; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button:hover { color: var(--ink); background: var(--raised); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chk { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--ring); border-radius: 7px; padding: 4px 10px; color: var(--ink2); cursor: pointer; }
.chk input { margin: 0; accent-color: var(--accent); }
.hud { position: absolute; right: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--ring); border-radius: 8px; padding: 5px 11px; font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100% - 16px); }
.hud b { font-weight: 600; }
.captions { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; pointer-events: none; max-width: min(320px, calc(100% - 190px)); }
.caption { background: rgba(12, 18, 28, 0.72); color: #fff; border-left: 3px solid #ffd43b; border-radius: 7px; padding: 4px 10px 5px; }
.caption b { display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.caption span { font-size: 12px; color: #d0d8e4; }
.inset text { font: 11px var(--font); stroke: none; }
.videopanel { position: absolute; inset: 10px; background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 10px 12px; overflow: auto; z-index: 4; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.videopanel h3 { margin: 0 0 4px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.videopanel img { width: 100%; border-radius: 6px; margin-top: 8px; }
.videopanel .files { font-size: 12px; color: var(--ink2); word-break: break-all; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 3px 8px; border-radius: 5px; font-size: 12px; white-space: nowrap; z-index: 3; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink2); padding: 20px; text-align: center; }
.parts { border: 1px solid var(--ring); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.plist { overflow: auto; flex: 1 1 45%; min-height: 80px; padding: 4px 0; }
.pgroup { padding: 8px 12px 3px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.prow { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.prow:hover { background: var(--raised); }
.prow[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px var(--ring); }
.prow .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .m { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pinfo { border-top: 1px solid var(--ring); overflow: auto; flex: 1 1 55%; padding: 10px 12px; }
.pinfo h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 6px; }
.pinfo .meta { color: var(--ink2); font-size: 12.5px; margin: 2px 0 8px; }
.props { width: 100%; border-collapse: collapse; font-size: 13px; }
.props td { padding: 3px 0; vertical-align: top; }
.props td.k { color: var(--ink2); padding-right: 10px; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.props td.val { word-break: break-word; }
.props td.val.edit { cursor: text; border-radius: 3px; }
.props td.val.edit:hover { background: var(--raised); box-shadow: inset 0 0 0 1px var(--ring); }
.props input, .props select { width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; background: var(--surface); }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.toast { color: var(--ink2); font-size: 12.5px; margin-top: 8px; }
.toast.err { color: var(--crit); }
.scrub { display: grid; grid-template-columns: auto minmax(140px, 1fr) auto; align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--ring); border-radius: var(--radius); background: var(--raised); }
.scrub input[type=range] { accent-color: var(--accent); width: 100%; margin: 0; }
.btn.play { min-width: 76px; font-weight: 600; background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.play:hover { opacity: .88; background: var(--ink); }
.tlabel { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; white-space: nowrap; min-width: 150px; }
.speedctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.speedctl input[type=range] { width: 180px; flex: 0 1 180px; }
.speedctl output { min-width: 48px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.speedctl .presets { display: inline-flex; gap: 4px; }
.speedctl .presets button { border: 1px solid var(--ring); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; cursor: pointer; color: var(--ink2); }
.speedctl .presets button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.speedctl .note { color: var(--muted); font-size: 12.5px; }
.chips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--ring); background: var(--surface); border-radius: 14px; padding: 2px 11px; font-size: 12.5px; color: var(--ink2); cursor: pointer; }
.chip:hover { background: var(--surface); color: var(--ink); border-color: var(--ink2); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.readout { position: sticky; top: 0; z-index: 2; background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 8px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px 14px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
.readout > span { display: flex; flex-direction: column; color: var(--ink2); font-size: 12px; line-height: 1.25; min-width: 0; }
.readout > span > b { color: var(--ink); font-weight: 600; font-size: 15px; }
.readout .u { color: var(--muted); font-size: 12px; font-weight: 400; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; }
@media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
.chart { border: 1px solid var(--ring); border-radius: var(--radius); padding: 10px 12px 6px; min-width: 0; }
.chart h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.chart h3 .unit { color: var(--muted); font-weight: 400; }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--ink2); margin-left: auto; font-weight: 400; }
.key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; border-radius: 1px; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: none; cursor: crosshair; }
svg text { font: 11.5px var(--font); fill: var(--muted); }
svg .lbl { fill: var(--ink2); }
svg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.axisline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.evline { stroke: var(--muted); stroke-dasharray: 2 3; stroke-width: 1; opacity: .75; }
.cross { stroke: var(--ink2); stroke-width: 1; }
.brush { fill: var(--accent); opacity: .12; }
.traj { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
@media (max-width: 900px) { .traj { grid-template-columns: 1fr; } }
.checks { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.checks col.c1 { width: 92px; } .checks col.c2 { width: 27%; } .checks col.c3 { width: 30%; } .checks col.c5 { width: 13%; }
.checks td { overflow-wrap: anywhere; }
.checks th { text-align: left; font-weight: 600; color: var(--ink2); padding: 7px 10px; border-bottom: 1px solid var(--ring); position: sticky; top: 0; background: var(--surface); }
.checks td { padding: 8px 10px; border-bottom: 1px solid var(--ring); vertical-align: top; line-height: 1.4; }
.checks td.ref { color: var(--muted); font-size: 12px; }
.checks tbody tr:hover { background: var(--raised); }
.status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 600; }
.icon { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.icon.PASS { background: var(--good); } .icon.FAIL { background: var(--crit); } .icon.WARN { background: var(--warn); color: #3a2a00; } .icon.INFO { background: var(--info); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }
details.manual { margin-top: 12px; font-size: 13px; color: var(--ink2); }
details.manual summary { cursor: pointer; color: var(--ink); }
.foot { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msg { padding: 40px 20px; text-align: center; color: var(--ink2); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ring); border-top-color: var(--ink2); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Narrow (a chat panel, a phone): the page scrolls as a whole; the model above its parts list. */
@media (max-width: 900px) {
  body.fill .app { height: auto; }
  .panel, body.fill .panel { height: auto; overflow: visible; flex: none; }
  #tab-model { overflow: visible; }
  .model { grid-template-columns: 1fr; grid-template-rows: 400px auto; flex: none; }
  .parts { flex-direction: row; height: 300px; }
  .parts .plist { flex: 1 1 50%; }
  .parts .pinfo { flex: 1 1 50%; border-top: 0; border-left: 1px solid var(--ring); }
}
@media (max-width: 900px) {
  .checks, .checks tbody { display: block; }
  .checks colgroup, .checks thead { display: none; }
  .checks tr { display: grid; grid-template-columns: 96px 1fr; gap: 2px 12px; padding: 10px 4px; border-bottom: 1px solid var(--ring); }
  .checks td { border: 0; padding: 0; }
  .checks td.st { grid-row: span 4; }
  .checks td.item { font-weight: 600; }
  .checks td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
}
@media (max-width: 560px) {
  .model { grid-template-rows: 320px auto; }
  .parts { flex-direction: column; height: 460px; }
  .parts .pinfo { border-left: 0; border-top: 1px solid var(--ring); }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="msg" class="msg"><span class="spin"></span>Loading the design view…</div>
<div id="app" class="app" hidden>
  <header class="top">
    <div><h1 id="name"></h1><div id="subtitle" class="sub"></div></div>
    <div class="actions">
      <button id="b-undo" class="btn" title="Undo the last change to the design" hidden>Undo</button>
      <button id="b-refresh" class="btn" title="Re-simulate with the design as it is now" hidden>Refresh</button>
      <button id="b-full" class="btn" title="Full screen">Full screen</button>
    </div>
  </header>
  <section id="metrics" class="metrics" aria-label="Key numbers"></section>
  <div id="problems" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="model" aria-selected="true">Rocket</button>
    <button role="tab" data-tab="flight">Flight plots</button>
    <button role="tab" data-tab="trajectory">Trajectory</button>
    <button role="tab" data-tab="checks">Rule checks<span id="checks-pill" class="pill"></span></button>
  </nav>
  <section id="tab-model" class="panel" role="tabpanel">
    <div class="vbar">
      <div class="seg" role="group" aria-label="View">
        <button data-view="3d" aria-pressed="true" title="Rotate with the mouse, scroll to zoom">3-D</button>
        <button data-view="side" title="Side view to scale with CG, CP and a ruler">Side</button>
        <button data-view="fly" title="Replay the simulated flight in 3-D">Fly</button>
      </div>
      <label class="chk" id="t-cut" title="Cut the airframe open to show the parts inside"><input type="checkbox" id="cut"> Cut-away</label>
      <label class="chk" id="t-explode" title="Pull the airframe sections apart">Exploded <input type="range" id="explode" min="0" max="1" step="0.01" value="0" style="width:90px"></label>
      <div class="seg" id="t-flycam" role="group" aria-label="Camera" hidden>
        <button data-flycam="chase" aria-pressed="true" title="The video's chase camera (drag to swing it round)">Chase</button>
        <button data-flycam="orbit" title="Circles the rocket as it plays; drag to look from anywhere">Orbit</button>
        <button data-flycam="pad" title="From the ground beside the pad, zoomed in like a long lens">Pad</button>
        <button data-flycam="whole" title="The whole trajectory, the rocket drawn larger">Whole flight</button>
      </div>
      <span class="grow"></span>
      <button id="b-video" class="btn" hidden title="Render this flight as a GIF and MP4 with key-moment stills, saved beside the design (animate_flight)">Make video</button>
    </div>
    <div class="model">
      <div id="viewport" class="viewport">
        <canvas id="gl" tabindex="0" aria-label="3-D model of the rocket: drag to rotate, scroll to zoom, click a part"></canvas>
        <svg id="overlay" class="overlay"></svg>
        <div id="captions" class="captions" aria-live="polite"></div>
        <div id="videopanel" class="videopanel" hidden></div>
        <div id="hud" class="hud"></div>
        <div id="tip3d" class="tip" hidden></div>
      </div>
      <aside class="parts">
        <div id="plist" class="plist" role="listbox" aria-label="Parts"></div>
        <div id="pinfo" class="pinfo"></div>
      </aside>
    </div>
    <div class="scrub">
      <button id="play" class="btn play" title="Play the flight (space)">Play</button>
      <input type="range" id="time" min="0" max="1" step="0.01" value="0" aria-label="Flight time">
      <span id="tlabel" class="tlabel"></span>
      <div class="speedctl" id="t-speed">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="-2" max="2.3219" step="0.01" value="0" aria-label="Playback speed, 0.25x to 5x" title="Playback speed ([ and ] to step)">
        <output id="speed-out" for="speed">1×</output>
        <span class="presets" role="group" aria-label="Speed presets"></span>
        <label class="chk" title="Pace it like the video: real time through the burn, slower round apogee and each deployment, faster on the way down. Off: the same speed all through."><input type="checkbox" id="pacing" checked> Video pacing</label>
        <span id="speed-note" class="note"></span>
      </div>
      <div id="chips" class="chips"></div>
    </div>
  </section>
  <section id="tab-flight" class="panel" role="tabpanel" hidden>
    <div class="row">
      <div class="seg" role="group" aria-label="Time range">
        <button data-range="ascent" aria-pressed="true">Ascent</button>
        <button data-range="all">Whole flight</button>
      </div>
      <span class="sub">Drag across a plot to zoom; double-click to reset; click to set the time.</span>
    </div>
    <div id="readout" class="readout"></div>
    <div id="charts" class="charts"></div>
  </section>
  <section id="tab-trajectory" class="panel" role="tabpanel" hidden>
    <div id="traj" class="traj"></div>
  </section>
  <section id="tab-checks" class="panel" role="tabpanel" hidden>
    <div class="row">
      <div class="seg" role="group" aria-label="Filter">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="FAIL">Failures</button>
        <button data-filter="WARN">Warnings</button>
        <button data-filter="PASS">Passes</button>
      </div>
      <span id="checks-summary" class="sub"></span>
    </div>
    <table class="checks"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup><thead><tr><th>Status</th><th>Check</th><th>Value</th><th>Requirement</th><th>Ref</th></tr></thead><tbody id="checks-body"></tbody></table>
    <details id="manual" class="manual"><summary>Manual checks to plan</summary><ul id="manual-list"></ul></details>
  </section>
  <footer class="foot"><span id="foot-l"></span><span id="foot-r">OpenRocket simulation · estimates, not a substitute for ground tests and RSO review</span></footer>
</div>
<!--OR-DATA-->
<script>
"use strict";
(function () {
  // ------------------------------------------------------------------ small helpers
  const $ = (s, root) => (root || document).querySelector(s);
  const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));

      if (sp.equal) {
        const k = Math.max((xhi - xlo) / pw, (yhi - ylo) / ph), cx = (xlo + xhi) / 2, cy = (ylo + yhi) / 2;
        xlo = cx - k * pw / 2; xhi = cx + k * pw / 2; ylo = cy - k * ph / 2; yhi = cy + k * ph / 2;
      }
      const tx = ticks(xlo, xhi, Math.max(3, Math.round(pw / 80))), ty = ticks(ylo, yhi, 5);
      const X = (x) => m.l + (x - xlo) / (xhi - xlo) * pw, Y = (y) => H - m.b - (y - ylo) / (yhi - ylo) * ph;
      this.X = X; this.Y = Y;
      for (const v of ty.ticks) if (v >= ylo && v <= yhi) { svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: v === 0 ? "axisline" : "gridline" })); svg.append(s("text", { x: m.l - 6, y: Y(v) + 3.5, "text-anchor": "end" }, num(v))); }
      for (const v of tx.ticks) if (v >= xlo && v <= xhi) { svg.append(s("line", { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, class: v === 0 ? "axisline" : "gridline" })); svg.append(s("text", { x: X(v), y: H - m.b + 14, "text-anchor": "middle" }, num(v))); }
      svg.append(s("text", { x: W - m.r, y: H - 2, "text-anchor": "end", class: "lbl" }, sp.xLabel));
      svg.append(s("text", { x: m.l, y: m.t - 4, class: "lbl" }, sp.yLabel));
      for (const ln of sp.lines) {
        const d = ln.pts.map(([x, y], i) => (i ? "L" : "M") + X(x).toFixed(1) + "," + Y(y).toFixed(1)).join("");
        svg.append(s("path", { d, fill: "none", stroke: cssColor(ln.color), "stroke-width": 2, "stroke-dasharray": ln.dash || null, "stroke-linejoin": "round" }));
      }
      // Markers at the same spot share one label; each label takes the first free corner around its marker.
      const items = [];
      for (const mk of sp.marks || []) {
        const x = X(mk.x), y = Y(mk.y), same = items.find((it) => Math.hypot(it.x - x, it.y - y) < 7);
        if (same) { same.label += " · " + mk.label; if (mk.shape === "x") same.shape = "x"; continue; }
        items.push({ x, y, label: mk.label, shape: mk.shape });
      }
      for (const it of items) {
        const x = it.x, y = it.y;
        if (it.shape === "x") svg.append(s("path", { d: "M" + (x - 4) + "," + (y - 4) + "L" + (x + 4) + "," + (y + 4) + "M" + (x - 4) + "," + (y + 4) + "L" + (x + 4) + "," + (y - 4), stroke: cssColor("--ink"), "stroke-width": 2 }));
        else svg.append(s("circle", { cx: x, cy: y, r: 4, fill: cssColor("--surface"), stroke: cssColor("--ink"), "stroke-width": 1.5 }));
      }
      const placed = [], spots = [[8, -8, false], [8, 17, false], [-8, -8, true], [-8, 17, true], [0, -13, null], [0, 24, null], [8, -24, false],
        [-8, -24, true], [0, -30, null], [-8, -40, true], [8, -40, false], [0, -46, null]];
      const boxOf = (it, [dx, dy, end], w) => { const x0 = end === null ? it.x - w / 2 : end ? it.x + dx - w : it.x + dx, y0 = it.y + dy - 12; return [x0, y0, x0 + w, y0 + 16]; };
      for (const it of items) {
        const w = it.label.length * 6.6 + 6; // 11.5 px labels
        const fits = spots.filter((sp2) => { const b = boxOf(it, sp2, w); return b[0] >= 0 && b[2] <= W && b[1] >= m.t - 12 && b[3] <= H - m.b - 2; });
        const free = fits.find((sp2) => {
          const box = boxOf(it, sp2, w);
          return !placed.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])
            && !items.some((o) => o.x > box[0] - 5 && o.x < box[2] + 5 && o.y > box[1] - 5 && o.y < box[3] + 5);
        }) || fits[0] || spots[0];
        placed.push(boxOf(it, free, w));
        if (free[1] < -20) { // moved away from its marker: a thin leader line back to it
          svg.append(s("line", { x1: it.x, y1: it.y - 5, x2: it.x + (free[2] === null ? 0 : free[0] / 2), y2: it.y + free[1] + 4, stroke: cssColor("--muted"), "stroke-width": 1 }));
        }
        svg.append(s("text", { x: it.x + free[0], y: it.y + free[1], class: "lbl halo", "text-anchor": free[2] === null ? "middle" : free[2] ? "end" : "start" }, it.label));
      }
      if (sp.arrow) {
        // Where the wind blows toward, with an arrowhead; the label says where it comes from.
        const a = sp.arrow, x = W - m.r - 52, y = m.t + 30, L = 16, ux = Math.cos(a.rad), uy = -Math.sin(a.rad), col = cssColor("--ink2");
        const tip = [x + ux * L, y + uy * L], back = [x - ux * L, y - uy * L], wx = -uy * 5, wy = ux * 5;
        svg.append(s("line", { x1: back[0], y1: back[1], x2: tip[0] - ux * 6, y2: tip[1] - uy * 6, stroke: col, "stroke-width": 1.5 }));
        svg.append(s("path", { d: "M" + tip[0] + "," + tip[1] + "L" + (tip[0] - ux * 8 + wx) + "," + (tip[1] - uy * 8 + wy) + "L" + (tip[0] - ux * 8 - wx) + "," + (tip[1] - uy * 8 - wy) + "Z", fill: col }));
        svg.append(s("text", { x, y: y + 32, "text-anchor": "middle", class: "lbl" }, a.label));
      }
      this.crossG = s("g");
      svg.append(this.crossG);
      this.cross(S.T);
    }
    hover(e) {
      if (!this.X) return;
      const r = this.svg.getBoundingClientRect(), px = (e.clientX - r.left) * (this.svg.viewBox.baseVal.width / r.width), py = (e.clientY - r.top) * (this.svg.viewBox.baseVal.height / r.height);
      const main = this.spec.lines[0];
      let best = -1, bd = Infinity;
      for (let i = 0; i < main.pts.length; i++) { const d = Math.hypot(this.X(main.pts[i][0]) - px, this.Y(main.pts[i][1]) - py); if (d < bd) { bd = d; best = i; } }
      this.hoverT = bd < 40 ? main.t[best] : null;
      this.cross(this.hoverT != null ? this.hoverT : S.T, this.hoverT != null);
    }
    cross(t, label) {
      if (!this.crossG) return;
      const g = this.crossG, sp = this.spec, main = sp.lines[0];
      g.replaceChildren();
      const x = sp.at(t);
      if (!x) return;
      const X = this.X(x[0]), Y = this.Y(x[1]);
      g.append(s("circle", { cx: X, cy: Y, r: 5, fill: cssColor(main.color), stroke: cssColor("--surface"), "stroke-width": 2 }));
      if (label) {
        const u = S.data.units;
        const txt = fmtT(t) + " · " + num(conv(Math.max(0, interp(S.data.flight.path.up, t)), u.distance)) + " " + u.distance;
        g.append(s("text", { x: X + 8, y: Y + 14, class: "lbl" }, txt));
      }
    }
  }
  function buildTrajectory() {
    const box = $("#traj"), f = S.data.flight, u = S.data.units, D = (m) => conv(m, u.distance);
    box.replaceChildren();
    S.traj = [];
    const n = f.t.length, land = [f.path.east[n - 1] || 0, f.path.north[n - 1] || 0];
    const dl = Math.hypot(land[0], land[1]);
    const dir = dl > 1 ? [land[0] / dl, land[1] / dl] : [1, 0];
    const down = (e, nn) => e * dir[0] + nn * dir[1];
    const main = { t: [], pts: [], gpts: [], color: "--s1" };
    for (let i = 0; i < n; i++) {
      const e = f.path.east[i], nn = f.path.north[i], up = f.path.up[i];
      if (e == null || up == null) continue;
      main.t.push(f.t[i]);
      main.pts.push([D(down(e, nn)), D(Math.max(0, up))]);
      main.gpts.push([D(e), D(nn)]);
    }
    const stages = (f.stages || []).map((st) => {
      const pts = [], gpts = [];
      for (let i = 0; i < st.t.length; i++) if (st.east[i] != null && st.t[i] >= st.separation) { pts.push([D(down(st.east[i], st.north[i])), D(Math.max(0, st.up[i]))]); gpts.push([D(st.east[i]), D(st.north[i])]); }
      return { name: st.name, pts, gpts };
    }).filter((x) => x.pts.length > 1);
    const marks = [], gmarks = [];
    for (const e of f.events) {
      if (e.branch !== 0 || !["apogee", "deploy", "landing"].includes(e.kind)) continue;
      const i = Math.max(0, main.t.findIndex((t) => t >= e.t));
      if (!main.pts[i]) continue;
      const lbl = e.kind === "deploy" ? (e.device || "Deploy") : e.title;
      marks.push({ x: main.pts[i][0], y: main.pts[i][1], label: lbl, shape: e.kind === "landing" ? "x" : "o" });
      if (e.kind !== "apogee") gmarks.push({ x: main.gpts[i][0], y: main.gpts[i][1], label: lbl, shape: e.kind === "landing" ? "x" : "o" });
    }
    gmarks.push({ x: 0, y: 0, label: "Pad", shape: "o" });
    const at = (t, key) => { const e = interp(f.path.east, t), nn = interp(f.path.north, t), up = interp(f.path.up, t); return key === "g" ? [D(e), D(nn)] : [D(down(e, nn)), D(Math.max(0, up))]; };
    const legend = stages.length ? [["--s1", "Sustainer"], ["--s2", "Dropped stage"]] : null;
    S.traj.push(new XYChart(box, { title: "Altitude against distance downrange", unit: u.distance, xLabel: "downrange, " + u.distance, yLabel: "altitude, " + u.distance,
      lines: [main, ...stages.map((x) => ({ pts: x.pts, color: "--s2", dash: "5 3" }))], marks, ground: true, include: [[0, 0]], at: (t) => at(t), legend, height: 280 }));
    const w = f.wind || {};
    const wr = fin(w.direction) ? (90 - (w.direction + 180)) * Math.PI / 180 : null; // the wind blows toward direction + 180 deg (compass)
    S.traj.push(new XYChart(box, { title: "Ground track (north up)", unit: u.distance, xLabel: "east, " + u.distance, yLabel: "north, " + u.distance,
      lines: [{ t: main.t, pts: main.gpts, color: "--s1" }, ...stages.map((x) => ({ pts: x.gpts, color: "--s2", dash: "5 3" }))], marks: gmarks, equal: true, include: [[0, 0]],
      at: (t) => at(t, "g"), arrow: wr != null && w.speed > 0 ? { rad: wr, label: "wind from " + Math.round((w.direction % 360 + 360) % 360) + "°, " + num(w.speed) + " " + u.velocity } : null, height: 280 }));
    S.traj[0].spec.lines[0].t = main.t;
  }

  // ------------------------------------------------------------------ playback
  let lastFrame = 0;
  function playStep(now) {
    if (!S.playing) return;
    const dt = Math.min(0.25, (now - (lastFrame || now)) / 1000);
    lastFrame = now;
    const t = S.T + dt * playRate();
    if (t >= tEnd()) { setT(tEnd()); togglePlay(false); return; }
    setT(t);
    requestAnimationFrame(playStep);
  }
  // Flight seconds per second: the chosen speed (0.25x to 5x) times the video's pacing (real time through the burn,
  // slower round apogee and each deployment, faster on the way down) or times real time.
  function playRate() {
    const pace = S.pacing && S.viewer && S.viewer.replay ? S.viewer.replay.rate(S.T) : 1;
    return pace * S.speed;
  }
  const SPEEDS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 5], PRESETS = [0.25, 0.5, 1, 2, 5];
  // Speed from the slider (log2 scale), snapped to a round step near a preset.
  function setSpeed(x) {
    x = clamp(x, 0.25, 5);
    const near = SPEEDS.find((p) => Math.abs(Math.log2(p) - Math.log2(x)) < 0.05);
    S.speed = near || (x < 1 ? Math.round(x * 20) / 20 : Math.round(x * 10) / 10);
    $("#speed").value = Math.log2(S.speed);
    $("#speed-out").textContent = num(S.speed) + "×";
    for (const b of $$(".presets button")) b.setAttribute("aria-pressed", String(+b.dataset.speed === S.speed));
    $("#speed-note").textContent = S.pacing ? "1× = the video's pace" : "1× = real time";
    if (S.data) updateHud();
  }
  function stepSpeed(dir) {
    const i = SPEEDS.findIndex((p) => p >= S.speed - 1e-9);
    setSpeed(SPEEDS[clamp((SPEEDS[i] === S.speed || dir < 0 ? i : i - 1) + dir, 0, SPEEDS.length - 1)]);
  }
  // animate_flight from the view: the GIF / MP4 and key-moment stills are written beside the design; the stills come
  // back as an image to show here.
  async function makeVideo() {
    const panel = $("#videopanel"), btn = $("#b-video");
    if (S.busy) return;
    togglePlay(false);
    btn.disabled = true;
    setBusy(true);
    panel.hidden = false;
    panel.replaceChildren(h("h3", {}, "Making the video"), h("div", { class: "files" }, h("span", { class: "spin" }), "Rendering every frame of the flight; this takes a little while (longer with an MP4)."));
    try {
      const r = await request("tools/call", { name: "animate_flight", arguments: { designId: S.data.design.designId, simulation: S.data.design.simulation } }, 600000);
      const text = (r.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
      if (r.isError) throw new Error(text.replace(/^Error:\s*/, ""));
      let j = {};
      try { j = JSON.parse(text); } catch (e) { /* plain text */ }
      const img = (r.content || []).find((c) => c.type === "image");
      const close = h("button", { class: "btn", onclick: () => { panel.hidden = true; } }, "Close");
      panel.replaceChildren(h("h3", {}, "Video ready", close),
        h("div", { class: "files" }, [j.gif && "GIF: " + j.gif, j.mp4 && "MP4: " + j.mp4, j.length].filter(Boolean).map((x) => h("div", {}, x))),
        img ? h("img", { src: "data:" + img.mimeType + ";base64," + img.data, alt: "Key moments of the flight" }) : null);
      request("ui/update-model-context", { content: [{ type: "text", text: "From the design view the user rendered the flight video: " + [j.gif, j.mp4].filter(Boolean).join(", ") }] }).catch(() => {});
    } catch (e) {
      panel.replaceChildren(h("h3", {}, "No video", h("button", { class: "btn", onclick: () => { panel.hidden = true; } }, "Close")), h("div", { class: "toast err" }, e.message));
    } finally {
      btn.disabled = false;
      setBusy(false);
    }
  }
  function togglePlay(on) {
    S.playing = on == null ? !S.playing : on;
    $("#play").textContent = S.playing ? "Pause" : "Play";
    if (S.playing) {
      if (S.T >= tEnd() - 0.01) setT(0);
      if (S.viewer && S.viewer.mode !== "fly") setView("fly");
      lastFrame = 0;
      requestAnimationFrame(playStep);
    }
  }
  function setView(m) {
    for (const b of $$("[data-view]")) b.setAttribute("aria-pressed", String(b.dataset.view === m));
    S.viewer.setMode(m);
  }

  // ------------------------------------------------------------------ wiring
  function wire() {
    for (const b of $$(".tabs button")) b.addEventListener("click", () => selectTab(b.dataset.tab));
    for (const b of $$("[data-view]")) b.addEventListener("click", () => { if (S.viewer) setView(b.dataset.view); });
    for (const b of $$("[data-range]")) b.addEventListener("click", () => setRange(b.dataset.range));
    for (const b of $$("[data-filter]")) b.addEventListener("click", () => { S.filter = b.dataset.filter; for (const x of $$("[data-filter]")) x.setAttribute("aria-pressed", String(x === b)); renderChecks(); });
    $("#cut").addEventListener("change", (e) => { S.viewer.cut = e.target.checked; S.viewer.dirty(); });
    $("#explode").addEventListener("input", (e) => { S.viewer.explode = +e.target.value; if (S.viewer.mode === "side") S.viewer.frameSide(); else S.viewer.frame3d(); });
    for (const b of $$("[data-flycam]")) b.addEventListener("click", () => {
      for (const x of $$("[data-flycam]")) x.setAttribute("aria-pressed", String(x === b));
      S.viewer.flyCam = b.dataset.flycam;
      S.viewer.user = { az: 0, el: 0, zoom: 1 };
      S.viewer.dirty();
    });
    $(".presets").replaceChildren(...PRESETS.map((p) => h("button", { "data-speed": p, onclick: () => setSpeed(p) }, num(p) + "×")));
    $("#speed").addEventListener("input", (e) => setSpeed(Math.pow(2, +e.target.value)));
    $("#pacing").addEventListener("change", (e) => { S.pacing = e.target.checked; setSpeed(S.speed); });
    setSpeed(1);
    // Space plays and pauses; [ and ] step the speed (not while typing in a field).
    document.addEventListener("keydown", (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" && e.target.type !== "range" || tag === "textarea" || tag === "select" || e.target.isContentEditable) return;
      if (e.key === " " && tag !== "button") { e.preventDefault(); togglePlay(); }
      else if (e.key === "[") stepSpeed(-1);
      else if (e.key === "]") stepSpeed(1);
    });
    $("#b-video").addEventListener("click", makeVideo);
    $("#time").addEventListener("input", (e) => { togglePlay(false); setT(+e.target.value); });
    $("#play").addEventListener("click", () => togglePlay());
    $("#b-refresh").addEventListener("click", async () => { setBusy(true); try { await refresh(); } catch (e) { renderPartInfo(e.message, true); } finally { setBusy(false); } });
    $("#b-undo").addEventListener("click", async () => {
      setBusy(true);
      try {
        const r = await callTool("undo", { designId: S.data.design.designId });
        await refresh();
        let note = "Undone.";
        try { const j = JSON.parse(r.text); note = j.undone || j.summary || note; } catch (e) { /* text */ }
        renderPartInfo(typeof note === "string" ? note : "Undone.");
      } catch (e) { renderPartInfo(e.message, true); } finally { setBusy(false); }
    });
    $("#b-full").addEventListener("click", async () => {
      if (S.host) {
        const modes = S.ctx.availableDisplayModes || [];
        const want = S.ctx.displayMode === "fullscreen" ? "inline" : "fullscreen";
        if (modes.length && !modes.includes(want)) return;
        try { const r = await request("ui/request-display-mode", { mode: want }); S.ctx.displayMode = r.mode; setFill(r.mode === "fullscreen"); } catch (e) { /* host said no */ }
      } else if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
    });
    window.addEventListener("resize", () => { clearTimeout(S.rz); S.rz = setTimeout(() => { layoutTiles(); if (S.viewer) S.viewer.resize(); redrawCharts(); }, 80); });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!S.ctx.theme) applyTheme(); });
  }

  wire();
  const embedded = document.getElementById("or-data");
  if (embedded) {
    applyTheme();
    setFill(false);
    try { load(JSON.parse(embedded.textContent)); } catch (e) { showMessage("Could not read the design data: " + e.message); }
  } else {
    applyTheme();
    connect();
  }
  window.__orView = S; // for tests
})();
</script>
