<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRocket design view</title>
<style>
:root {
  color-scheme: light;
  --surface: var(--color-background-primary, #fcfcfb);
  --raised: var(--color-background-secondary, #f3f2ee);
  --ink: var(--color-text-primary, #0b0b0b);
  --ink2: var(--color-text-secondary, #52514e);
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --ring: var(--color-border-primary, rgba(11, 11, 11, 0.12));
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --info: #898781;
  --accent: #2a78d6;
  --view-a: #e9eef5; --view-b: #fafaf9;
  --sky-a: #c9dcf0; --sky-b: #f3f6f9;
  --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  --radius: var(--border-radius-md, 8px);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--color-background-primary, #1a1a19);
  --raised: var(--color-background-secondary, #262624);
  --ink: var(--color-text-primary, #f0efec);
  --ink2: var(--color-text-secondary, #c3c2b7);
  --grid: #2c2c2a; --axis: #45453f;
  --ring: var(--color-border-primary, rgba(255, 255, 255, 0.12));
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --accent: #3987e5;
  --view-a: #232830; --view-b: #171716;
  --sky-a: #172231; --sky-b: #1b1b1a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--surface); color: var(--ink); font: 13px/1.4 var(--font); }
body { -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 12px; }
body.fill .app { height: 100vh; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3; }
.sub { color: var(--ink2); font-size: 12px; }
.actions { display: flex; gap: 6px; flex: none; }
.btn { border: 1px solid var(--ring); background: var(--surface); border-radius: 6px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--raised); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 6px; }
.tile { border: 1px solid var(--ring); border-radius: var(--radius); padding: 5px 9px 6px; min-width: 0; }
.tile .l { color: var(--ink2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 17px; font-weight: 600; white-space: nowrap; }
.tile .u { font-size: 12px; color: var(--ink2); font-weight: 400; margin-left: 2px; }
.tile .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.tile { text-align: left; background: none; cursor: pointer; }
button.tile:hover { background: var(--raised); }
.banner { border: 1px solid var(--ring); border-left: 3px solid var(--crit); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--ring); }
.tabs button { border: 0; background: none; padding: 6px 10px; color: var(--ink2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.pill { display: inline-block; margin-left: 5px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600; background: var(--raised); color: var(--ink2); }
.panel { height: 470px; overflow: auto; }
body.fill .panel { height: auto; flex: 1 1 auto; min-height: 300px; }
#tab-model { overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.model { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 10px; flex: 1 1 auto; min-height: 0; }
@media (max-width: 660px) {
  .model { grid-template-columns: 1fr; grid-template-rows: 300px auto; flex: none; }
  .parts { height: 260px; }
  #tab-model { overflow: auto; }
}
.viewport { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--ring); touch-action: none; min-height: 0; background: linear-gradient(var(--view-a), var(--view-b)); }
.viewport.fly { background: linear-gradient(var(--sky-a), var(--sky-b)); }
#gl { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
#gl.dragging { cursor: grabbing; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.overlay text { font: 11px var(--font); }
.vtools { position: absolute; left: 8px; top: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.vtools > * { pointer-events: auto; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 3px 9px; cursor: pointer; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chk { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 2px 8px; color: var(--ink2); cursor: pointer; }
.chk input { margin: 0; accent-color: var(--accent); }
.hud { position: absolute; right: 8px; bottom: 8px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--ring); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; max-width: calc(100% - 16px); }
.hud b { font-weight: 600; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); padding: 2px 7px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 3; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink2); padding: 20px; text-align: center; }
.parts { border: 1px solid var(--ring); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.plist { overflow: auto; flex: 1 1 45%; min-height: 80px; padding: 2px 0; }
.pgroup { padding: 6px 9px 2px; font-size: 11px; color: var(--muted); font-weight: 600; }
.prow { display: flex; align-items: center; gap: 7px; padding: 3px 9px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
.prow:hover { background: var(--raised); }
.prow[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px var(--ring); }
.prow .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .m { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pinfo { border-top: 1px solid var(--ring); overflow: auto; flex: 1 1 55%; padding: 8px 9px; }
.pinfo h2 { font-size: 13px; margin: 0; display: flex; align-items: center; gap: 6px; }
.pinfo .meta { color: var(--ink2); font-size: 11px; margin: 1px 0 6px; }
.props { width: 100%; border-collapse: collapse; font-size: 12px; }
.props td { padding: 2px 0; vertical-align: top; }
.props td.k { color: var(--ink2); padding-right: 8px; white-space: nowrap; max-width: 104px; overflow: hidden; text-overflow: ellipsis; }
.props td.val { word-break: break-word; }
.props td.val.edit { cursor: text; border-radius: 3px; }
.props td.val.edit:hover { background: var(--raised); box-shadow: inset 0 0 0 1px var(--ring); }
.props input, .props select { width: 100%; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; background: var(--surface); }
.hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
.toast { color: var(--ink2); font-size: 11px; margin-top: 6px; }
.toast.err { color: var(--crit); }
.scrub { display: grid; grid-template-columns: auto minmax(120px, 1fr) 210px; align-items: center; gap: 4px 8px; }
.scrub input[type=range] { accent-color: var(--accent); width: 100%; margin: 0; }
.tlabel { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--ring); background: var(--surface); border-radius: 12px; padding: 0 8px; font-size: 11px; color: var(--ink2); cursor: pointer; }
.chip:hover { background: var(--raised); color: var(--ink); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.readout { position: sticky; top: 0; z-index: 2; background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 5px 9px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 14px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
.readout span { color: var(--ink2); white-space: nowrap; }
.readout b { color: var(--ink); font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
.chart { border: 1px solid var(--ring); border-radius: var(--radius); padding: 6px 8px 2px; min-width: 0; }
.chart h3 { margin: 0; font-size: 12px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.chart h3 .unit { color: var(--muted); font-weight: 400; }
.legend { display: flex; gap: 10px; font-size: 11px; color: var(--ink2); margin-left: auto; font-weight: 400; }
.key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; border-radius: 1px; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: none; cursor: crosshair; }
svg text { font: 10.5px var(--font); fill: var(--muted); }
svg .lbl { fill: var(--ink2); }
.gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.axisline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.evline { stroke: var(--muted); stroke-dasharray: 2 3; stroke-width: 1; opacity: .75; }
.cross { stroke: var(--ink2); stroke-width: 1; }
.brush { fill: var(--accent); opacity: .12; }
.traj { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.checks { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.checks col.c1 { width: 78px; } .checks col.c2 { width: 27%; } .checks col.c3 { width: 30%; } .checks col.c5 { width: 13%; }
.checks td { overflow-wrap: anywhere; }
.checks th { text-align: left; font-weight: 600; color: var(--ink2); padding: 4px 8px; border-bottom: 1px solid var(--ring); position: sticky; top: 0; background: var(--surface); }
.checks td { padding: 5px 8px; border-bottom: 1px solid var(--ring); vertical-align: top; }
.checks td.ref { color: var(--muted); font-size: 11px; }
.status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-weight: 600; }
.icon { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
.icon.PASS { background: var(--good); } .icon.FAIL { background: var(--crit); } .icon.WARN { background: var(--warn); color: #3a2a00; } .icon.INFO { background: var(--info); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 11px; }
.linkbtn:hover { text-decoration: underline; }
details.manual { margin-top: 10px; font-size: 12px; color: var(--ink2); }
details.manual summary { cursor: pointer; color: var(--ink); }
.foot { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.msg { padding: 40px 20px; text-align: center; color: var(--ink2); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ring); border-top-color: var(--ink2); border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="msg" class="msg"><span class="spin"></span>Loading the design view…</div>
<div id="app" class="app" hidden>
  <header class="top">
    <div><h1 id="name"></h1><div id="subtitle" class="sub"></div></div>
    <div class="actions">
      <button id="b-undo" class="btn" title="Undo the last change to the design" hidden>Undo</button>
      <button id="b-refresh" class="btn" title="Re-simulate with the design as it is now" hidden>Refresh</button>
      <button id="b-full" class="btn" title="Full screen">Full screen</button>
    </div>
  </header>
  <section id="metrics" class="metrics" aria-label="Key numbers"></section>
  <div id="problems" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="model" aria-selected="true">Rocket</button>
    <button role="tab" data-tab="flight">Flight plots</button>
    <button role="tab" data-tab="trajectory">Trajectory</button>
    <button role="tab" data-tab="checks">Rule checks<span id="checks-pill" class="pill"></span></button>
  </nav>
  <section id="tab-model" class="panel" role="tabpanel">
    <div class="model">
      <div id="viewport" class="viewport">
        <canvas id="gl" tabindex="0" aria-label="3-D model of the rocket: drag to rotate, scroll to zoom, click a part"></canvas>
        <svg id="overlay" class="overlay"></svg>
        <div class="vtools">
          <div class="seg" role="group" aria-label="View">
            <button data-view="3d" aria-pressed="true" title="Rotate with the mouse, scroll to zoom">3-D</button>
            <button data-view="side" title="Side view to scale with CG, CP and a ruler">Side</button>
            <button data-view="fly" title="Replay the simulated flight in 3-D">Fly</button>
          </div>
          <label class="chk" id="t-cut" title="Cut the airframe open to show the parts inside"><input type="checkbox" id="cut"> Cut-away</label>
          <label class="chk" id="t-explode" title="Pull the airframe sections apart"><input type="range" id="explode" min="0" max="1" step="0.01" value="0" style="width:70px"> Exploded</label>
          <label class="chk" id="t-whole" hidden title="Frame the whole trajectory instead of following the rocket"><input type="checkbox" id="whole"> Whole flight</label>
        </div>
        <div id="hud" class="hud"></div>
        <div id="tip3d" class="tip" hidden></div>
      </div>
      <aside class="parts">
        <div id="plist" class="plist" role="listbox" aria-label="Parts"></div>
        <div id="pinfo" class="pinfo"></div>
      </aside>
    </div>
    <div class="scrub">
      <button id="play" class="btn" title="Play the flight">Play</button>
      <input type="range" id="time" min="0" max="1" step="0.01" value="0" aria-label="Flight time">
      <span id="tlabel" class="tlabel"></span>
      <div id="chips" class="chips"></div>
    </div>
  </section>
  <section id="tab-flight" class="panel" role="tabpanel" hidden>
    <div class="row">
      <div class="seg" role="group" aria-label="Time range">
        <button data-range="ascent" aria-pressed="true">Ascent</button>
        <button data-range="all">Whole flight</button>
      </div>
      <span class="sub">Drag across a plot to zoom; double-click to reset; click to set the time.</span>
    </div>
    <div id="readout" class="readout"></div>
    <div id="charts" class="charts"></div>
  </section>
  <section id="tab-trajectory" class="panel" role="tabpanel" hidden>
    <div id="traj" class="traj"></div>
  </section>
  <section id="tab-checks" class="panel" role="tabpanel" hidden>
    <div class="row">
      <div class="seg" role="group" aria-label="Filter">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="FAIL">Failures</button>
        <button data-filter="WARN">Warnings</button>
        <button data-filter="PASS">Passes</button>
      </div>
      <span id="checks-summary" class="sub"></span>
    </div>
    <table class="checks"><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup><thead><tr><th>Status</th><th>Check</th><th>Value</th><th>Requirement</th><th>Ref</th></tr></thead><tbody id="checks-body"></tbody></table>
    <details id="manual" class="manual"><summary>Manual checks to plan</summary><ul id="manual-list"></ul></details>
  </section>
  <footer class="foot"><span id="foot-l"></span><span id="foot-r">OpenRocket simulation · estimates, not a substitute for ground tests and RSO review</span></footer>
</div>
<!--OR-DATA-->
<script>
"use strict";
(function () {
  // ------------------------------------------------------------------ small helpers
  const $ = (s, root) => (root || document).querySelector(s);
  const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return e;
  }
  const SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, text) {
    const e = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    return e;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fin = (v) => typeof v === "number" && isFinite(v);
  function num(v, sig) {
    if (!fin(v)) return "–";
    const a = Math.abs(v);
    const d = a >= 1000 ? 0 : a >= 100 ? (sig === 4 ? 1 : 0) : a >= 10 ? 1 : a >= 1 ? 2 : 3;
    return v.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: d });
  }
  const fmtT = (t) => (t < 10 ? t.toFixed(2) : t < 100 ? t.toFixed(1) : t.toFixed(0)) + " s";
  const LEN = { m: 1, mm: 1000, cm: 100, in: 1 / 0.0254, ft: 1 / 0.3048, km: 0.001, mi: 1 / 1609.344 };
  const conv = (m, unit) => m * (LEN[unit] || 1);

  // ------------------------------------------------------------------ state
  const S = {
    data: null, host: false, ctx: {}, T: 0, hoverT: null, tab: "model", sel: -1, xr: null, range: "ascent",
    filter: "all", playing: false, viewer: null, charts: [], traj: [], busy: false
  };

  // ------------------------------------------------------------------ theme and sizing
  function applyTheme(theme) {
    const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if (S.viewer) S.viewer.dirty();
    if (S.data) redrawCharts();
  }
  function applyHostContext(c) {
    if (!c) return;
    Object.assign(S.ctx, c);
    const vars = c.styles && c.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    if (c.styles && c.styles.css && c.styles.css.fonts && !$("#host-fonts")) document.head.append(h("style", { id: "host-fonts" }, c.styles.css.fonts));
    if (c.theme) applyTheme(c.theme);
    if (c.displayMode) setFill(c.displayMode === "fullscreen");
    const cd = c.containerDimensions;
    if (cd && "height" in cd) setFill(true);
  }
  function setFill(on) {
    document.body.classList.toggle("fill", !!on || !S.host);
    $("#b-full").textContent = on && S.host ? "Exit full screen" : "Full screen";
    if (S.viewer) S.viewer.resize();
    setTimeout(redrawCharts, 0);
  }
  let lastW = 0, lastH = 0, sizeQueued = false;
  function reportSize() {
    if (!S.host || sizeQueued) return;
    sizeQueued = true;
    requestAnimationFrame(() => {
      sizeQueued = false;
      const html = document.documentElement, old = html.style.height;
      html.style.height = "max-content";
      const height = Math.ceil(html.getBoundingClientRect().height);
      html.style.height = old;
      const width = Math.ceil(window.innerWidth);
      if (width !== lastW || height !== lastH) {
        lastW = width; lastH = height;
        notify("ui/notifications/size-changed", { width, height });
      }
    });
  }

  // ------------------------------------------------------------------ host connection (MCP Apps, JSON-RPC over postMessage)
  let rpcId = 0;
  const pending = new Map();
  function post(msg) { window.parent.postMessage(msg, "*"); }
  function notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); }
  function request(method, params, timeoutMs) {
    const id = ++rpcId;
    post({ jsonrpc: "2.0", id, method, params: params || {} });
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { if (pending.delete(id)) reject(new Error(method + " timed out")); }, timeoutMs || 120000);
      pending.set(id, { resolve: (r) => { clearTimeout(timer); resolve(r); }, reject: (e) => { clearTimeout(timer); reject(e); } });
    });
  }
  async function callTool(name, args) {
    const r = await request("tools/call", { name, arguments: args });
    const text = (r.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
    if (r.isError) throw new Error(text.replace(/^Error:\s*/, "") || name + " failed");
    return { text, data: r.structuredContent };
  }
  function onMessage(ev) {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || "request failed")); else p.resolve(m.result || {});
      return;
    }
    const reply = (result) => { if (m.id != null) post({ jsonrpc: "2.0", id: m.id, result: result || {} }); };
    switch (m.method) {
      case "ui/notifications/tool-input": S.toolArgs = (m.params && m.params.arguments) || {}; break;

  // ------------------------------------------------------------------ data
  function decode(b64) {

  // ------------------------------------------------------------------ 4x4 matrices (column-major)
  const V = {

      this.el = h("div", { class: "chart" }, h("h3", {}, spec.title, h("span", { class: "unit" }, spec.unit),
        spec.legend ? h("span", { class: "legend" }, spec.legend.map(([c, t]) => h("span", {}, h("span", { class: "key", style: "background:var(" + c + ")" }), t))) : null));
      this.svg = s("svg", { height: spec.height || 260, role: "img", "aria-label": spec.title });
      this.el.append(this.svg);
      box.append(this.el);
      this.svg.addEventListener("pointermove", (e) => this.hover(e));
      this.svg.addEventListener("pointerleave", () => this.cross(S.T));
      this.svg.addEventListener("click", () => { if (this.hoverT != null) setT(this.hoverT); });
    }
    draw() {
      const svg = this.svg, W = svg.clientWidth || 300, H = this.spec.height || 260, m = { l: 50, r: 14, t: 14, b: 26 }, sp = this.spec;
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.replaceChildren();
      let xlo = Infinity, xhi = -Infinity, ylo = Infinity, yhi = -Infinity;
      for (const ln of sp.lines) for (const [x, y] of ln.pts) { xlo = Math.min(xlo, x); xhi = Math.max(xhi, x); ylo = Math.min(ylo, y); yhi = Math.max(yhi, y); }
      for (const [x, y] of sp.include || []) { xlo = Math.min(xlo, x); xhi = Math.max(xhi, x); ylo = Math.min(ylo, y); yhi = Math.max(yhi, y); }
      if (!isFinite(xlo)) return;
      const padx = (xhi - xlo) * 0.06 || 10, pady = (yhi - ylo) * 0.06 || 10;
      xlo -= padx; xhi += padx; ylo -= sp.ground ? 0 : pady; yhi += pady;
      const pw = W - m.l - m.r, ph = H - m.t - m.b;
      if (sp.equal) {
        const k = Math.max((xhi - xlo) / pw, (yhi - ylo) / ph), cx = (xlo + xhi) / 2, cy = (ylo + yhi) / 2;
        xlo = cx - k * pw / 2; xhi = cx + k * pw / 2; ylo = cy - k * ph / 2; yhi = cy + k * ph / 2;
      }
      const tx = ticks(xlo, xhi, Math.max(3, Math.round(pw / 80))), ty = ticks(ylo, yhi, 5);
      const X = (x) => m.l + (x - xlo) / (xhi - xlo) * pw, Y = (y) => H - m.b - (y - ylo) / (yhi - ylo) * ph;
      this.X = X; this.Y = Y;
      for (const v of ty.ticks) if (v >= ylo && v <= yhi) { svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: v === 0 ? "axisline" : "gridline" })); svg.append(s("text", { x: m.l - 6, y: Y(v) + 3.5, "text-anchor": "end" }, num(v))); }
      for (const v of tx.ticks) if (v >= xlo && v <= xhi) { svg.append(s("line", { x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, class: v === 0 ? "axisline" : "gridline" })); svg.append(s("text", { x: X(v), y: H - m.b + 14, "text-anchor": "middle" }, num(v))); }
      svg.append(s("text", { x: W - m.r, y: H - 2, "text-anchor": "end", class: "lbl" }, sp.xLabel));
      svg.append(s("text", { x: m.l, y: m.t - 4, class: "lbl" }, sp.yLabel));

        const d = ln.pts.map(([x, y], i) => (i ? "L" : "M") + X(x).toFixed(1) + "," + Y(y).toFixed(1)).join("");

      }

      const items = [];
      for (const mk of sp.marks || []) {
        const x = X(mk.x), y = Y(mk.y), same = items.find((it) => Math.hypot(it.x - x, it.y - y) < 7);
        if (same) { same.label += " · " + mk.label; if (mk.shape === "x") same.shape = "x"; continue; }
        items.push({ x, y, label: mk.label, shape: mk.shape });

      for (const it of items) {
        const x = it.x, y = it.y;
        if (it.shape === "x") svg.append(s("path", { d: "M" + (x - 4) + "," + (y - 4) + "L" + (x + 4) + "," + (y + 4) + "M" + (x - 4) + "," + (y + 4) + "L" + (x + 4) + "," + (y - 4), stroke: cssColor("--ink"), "stroke-width": 2 }));

      const placed = [], spots = [[8, -7, false], [8, 15, false], [-8, -7, true], [-8, 15, true], [0, -12, null], [0, 22, null]];
      const boxOf = (it, [dx, dy, end], w) => { const x0 = end === null ? it.x - w / 2 : end ? it.x + dx - w : it.x + dx, y0 = it.y + dy - 10; return [x0, y0, x0 + w, y0 + 13]; };
      for (const it of items) {
        const w = it.label.length * 5.9 + 4;
        const fits = spots.filter((sp2) => { const b = boxOf(it, sp2, w); return b[0] >= 0 && b[2] <= W && b[1] >= m.t - 12 && b[3] <= H - m.b - 2; });

            && !items.some((o) => o.x > box[0] - 5 && o.x < box[2] + 5 && o.y > box[1] - 5 && o.y < box[3] + 5);
        }) || fits[0] || spots[0];
        placed.push(boxOf(it, free, w));
        svg.append(s("text", { x: it.x + free[0], y: it.y + free[1], class: "lbl", "text-anchor": free[2] === null ? "middle" : free[2] ? "end" : "start" }, it.label));
      }
      if (sp.arrow) {
        // Where the wind blows toward, with an arrowhead; the label says where it comes from.
        const a = sp.arrow, x = W - m.r - 52, y = m.t + 30, L = 16, ux = Math.cos(a.rad), uy = -Math.sin(a.rad), col = cssColor("--ink2");
        const tip = [x + ux * L, y + uy * L], back = [x - ux * L, y - uy * L], wx = -uy * 5, wy = ux * 5;
        svg.append(s("line", { x1: back[0], y1: back[1], x2: tip[0] - ux * 6, y2: tip[1] - uy * 6, stroke: col, "stroke-width": 1.5 }));
        svg.append(s("path", { d: "M" + tip[0] + "," + tip[1] + "L" + (tip[0] - ux * 8 + wx) + "," + (tip[1] - uy * 8 + wy) + "L" + (tip[0] - ux * 8 - wx) + "," + (tip[1] - uy * 8 - wy) + "Z", fill: col }));
        svg.append(s("text", { x, y: y + 32, "text-anchor": "middle", class: "lbl" }, a.label));
      }
      this.crossG = s("g");
      svg.append(this.crossG);

    }
    hover(e) {
      if (!this.X) return;
      const r = this.svg.getBoundingClientRect(), px = (e.clientX - r.left) * (this.svg.viewBox.baseVal.width / r.width), py = (e.clientY - r.top) * (this.svg.viewBox.baseVal.height / r.height);
      const main = this.spec.lines[0];
      let best = -1, bd = Infinity;
      for (let i = 0; i < main.pts.length; i++) { const d = Math.hypot(this.X(main.pts[i][0]) - px, this.Y(main.pts[i][1]) - py); if (d < bd) { bd = d; best = i; } }
      this.hoverT = bd < 40 ? main.t[best] : null;
      this.cross(this.hoverT != null ? this.hoverT : S.T, this.hoverT != null);
    }
    cross(t, label) {
      if (!this.crossG) return;
      const g = this.crossG, sp = this.spec, main = sp.lines[0];
      g.replaceChildren();
      const x = sp.at(t);
      if (!x) return;
      const X = this.X(x[0]), Y = this.Y(x[1]);

  function buildTrajectory() {

    const dl = Math.hypot(land[0], land[1]);

    const down = (e, nn) => e * dir[0] + nn * dir[1];
    const main = { t: [], pts: [], gpts: [], color: "--s1" };
    for (let i = 0; i < n; i++) {
      const e = f.path.east[i], nn = f.path.north[i], up = f.path.up[i];
      if (e == null || up == null) continue;
      main.t.push(f.t[i]);

      if (e.kind !== "apogee") gmarks.push({ x: main.gpts[i][0], y: main.gpts[i][1], label: lbl, shape: e.kind === "landing" ? "x" : "o" });

  // ------------------------------------------------------------------ playback
  let lastFrame = 0;
  function playStep(now) {

    const burn = (S.data.flight.events.find((e) => e.kind === "burnout") || { t: 3 }).t;

  // ------------------------------------------------------------------ wiring

    for (const b of $$(".tabs button")) b.addEventListener("click", () => selectTab(b.dataset.tab));

    });

  }

  wire();
  const embedded = document.getElementById("or-data");
  if (embedded) {
    applyTheme();
    setFill(false);
    try { load(JSON.parse(embedded.textContent)); } catch (e) { showMessage("Could not read the design data: " + e.message); }
  } else {

    connect();
  }
  window.__orView = S; // for tests
